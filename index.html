<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#2f6fb5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="application-name" content="Погода">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<title>Погода</title>
<link rel="icon" type="image/svg+xml" href="weather-icon.svg">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  /* фон под системными панелями телефона: цвет нижней точки градиента текущей погоды */
  html { background: #6aa3d8; transition: background 0.8s; }
  body { min-height: 100dvh; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: #fff; background: linear-gradient(180deg, #2f6fb5 0%, #6aa3d8 100%);
    transition: background 0.8s;
  }
  body.night  { background: linear-gradient(180deg, #0b1026 0%, #2b3a67 100%); }
  body.cloudy { background: linear-gradient(180deg, #5b6b7d 0%, #9aa7b5 100%); }
  body.rain   { background: linear-gradient(180deg, #3a4a5c 0%, #66788a 100%); }
  body.snow   { background: linear-gradient(180deg, #7d8fa6 0%, #b9c6d4 100%); }

  #pages {
    display: flex; height: calc(100% - 56px - env(safe-area-inset-bottom)); overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none;
  }
  #pages::-webkit-scrollbar { display: none; }
  .page {
    flex: 0 0 100%; height: 100%; overflow-y: auto; scroll-snap-align: start;
    padding: calc(env(safe-area-inset-top) + 30px) 16px 30px;
  }
  .inner { max-width: 430px; margin: 0 auto; }
  .hero { text-align: center; margin: 10px 0 30px; text-shadow: 0 1px 4px rgba(0,0,0,.15); }
  .city { font-size: 32px; font-weight: 400; }
  .sub  { font-size: 13px; opacity: .8; text-transform: uppercase; font-weight: 600; }
  .temp { font-size: 96px; font-weight: 200; line-height: 1; margin-left: 24px; }
  .desc { font-size: 20px; font-weight: 500; opacity: .9; }
  .hilo { font-size: 20px; font-weight: 500; }
  .card {
    background: rgba(0,0,0,.15); backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
    border-radius: 16px; padding: 12px 16px; margin-bottom: 12px;
  }
  .card-title {
    font-size: 12px; text-transform: uppercase; opacity: .65; font-weight: 600;
    padding-bottom: 8px; border-bottom: 1px solid rgba(255,255,255,.2); margin-bottom: 10px;
  }
  .hourly { display: flex; overflow-x: auto; gap: 22px; scrollbar-width: none; }
  .hourly::-webkit-scrollbar { display: none; }
  .hour { display: flex; flex-direction: column; align-items: center; gap: 10px; flex: 0 0 auto; min-width: 40px; font-weight: 500; }
  .hour .ic { font-size: 24px; }
  .day {
    display: grid; grid-template-columns: 72px 30px 36px 1fr 36px; align-items: center;
    gap: 8px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,.15); font-size: 17px; font-weight: 500;
  }
  .day:last-child { border-bottom: none; }
  .day .min { opacity: .6; text-align: right; }
  .bar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.2); position: relative; }
  .bar span { position: absolute; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #8fd3f4, #f6d365, #fda085); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .grid .card { margin: 0; aspect-ratio: 1; display: flex; flex-direction: column; }
  .grid .card-title { border: none; margin: 0; }
  .big { font-size: 32px; font-weight: 400; margin-top: 4px; }
  .note { font-size: 14px; margin-top: auto; opacity: .85; }
  .updated { text-align: center; font-size: 12px; opacity: .7; margin-top: 16px; }
  .loading { text-align: center; margin-top: 35vh; font-size: 18px; opacity: .8; }

  .bottom {
    position: fixed; left: 0; right: 0; bottom: 0; height: calc(56px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom);
    display: flex; align-items: center; justify-content: space-between; padding-inline: 18px;
    background: rgba(0,0,0,.18); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  }
  .bottom button { background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; width: 40px; }
  .dots { display: flex; gap: 7px; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.4); }
  .dots i.on { background: #fff; }
  .spin { animation: spin 1s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #list {
    position: fixed; inset: 0; background: #000; z-index: 10; overflow-y: auto;
    padding: calc(env(safe-area-inset-top) + 20px) 16px 40px;
    transform: translateY(100%); transition: transform .35s ease;
  }
  #list.open { transform: none; }
  .list-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .list-head h1 { font-size: 34px; }
  .list-head button { background: none; border: none; color: #0a84ff; font-size: 17px; cursor: pointer; }
  .search { position: relative; margin-bottom: 14px; }
  .search input {
    width: 100%; padding: 10px 14px; border: none; border-radius: 10px;
    background: #1c1c1e; color: #fff; font-size: 17px; outline: none;
  }
  .results { margin-top: 6px; background: #1c1c1e; border-radius: 10px; overflow: hidden; }
  .results div { padding: 12px 14px; border-bottom: 1px solid #2c2c2e; cursor: pointer; }
  .results div:last-child { border-bottom: none; }
  .results small { opacity: .55; }
  .geo-btn {
    width: 100%; padding: 12px; margin-bottom: 14px; border: none; border-radius: 10px;
    background: #1c1c1e; color: #0a84ff; font-size: 16px; cursor: pointer;
  }
  .citem {
    position: relative; border-radius: 16px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer;
    display: flex; justify-content: space-between; min-height: 100px;
    background: linear-gradient(135deg, #2f6fb5, #6aa3d8);
  }
  .citem.night  { background: linear-gradient(135deg, #0b1026, #2b3a67); }
  .citem.cloudy { background: linear-gradient(135deg, #5b6b7d, #9aa7b5); }
  .citem.rain   { background: linear-gradient(135deg, #3a4a5c, #66788a); }
  .citem.snow   { background: linear-gradient(135deg, #7d8fa6, #b9c6d4); }
  .citem .n { font-size: 22px; font-weight: 600; }
  .citem .t { font-size: 13px; opacity: .85; margin-top: 2px; }
  .citem .d { position: absolute; bottom: 14px; left: 16px; font-size: 14px; opacity: .9; }
  .citem .r { text-align: right; }
  .citem .tt { font-size: 44px; font-weight: 300; line-height: 1; }
  .citem .hl { position: absolute; bottom: 14px; right: 16px; font-size: 14px; }
  .del {
    position: absolute; top: -6px; right: -6px; width: 26px; height: 26px; border-radius: 50%;
    border: none; background: #ff3b30; color: #fff; font-size: 14px; cursor: pointer; display: none;
  }
  #list.edit .del { display: block; }
  .hint { text-align: center; opacity: .5; font-size: 13px; margin-top: 16px; }
  .tap { cursor: pointer; }
  .tap:active { transform: scale(.97); }
  .tap .more { font-size: 12px; opacity: .6; margin-top: 4px; }
  .wide-chart { margin-top: 6px; }

  #detail {
    position: fixed; inset: 0; background: #1c1c1e; z-index: 20; overflow-y: auto;
    padding: calc(env(safe-area-inset-top) + 16px) 16px 40px;
    transform: translateY(100%); transition: transform .35s ease;
  }
  #detail.open { transform: none; }
  .dhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .dhead h2 { font-size: 20px; }
  .dhead button { background: #3a3a3c; border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 16px; cursor: pointer; }
  .tabs { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 16px; }
  .tabs::-webkit-scrollbar { display: none; }
  .tabs button {
    flex: 0 0 auto; width: 44px; padding: 6px 0; border: none; border-radius: 22px; background: none;
    color: #fff; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer;
  }
  .tabs small { font-size: 11px; opacity: .6; }
  .tabs b { font-size: 17px; font-weight: 500; }
  .tabs button.on { background: #fff; color: #000; }
  .tabs button.on small { opacity: .8; }
  .dval { font-size: 34px; font-weight: 500; }
  .dsub { font-size: 15px; opacity: .65; margin-bottom: 10px; min-height: 20px; }
  .chart-box { background: #2c2c2e; border-radius: 16px; padding: 12px 8px; touch-action: pan-y; }
  .chart-box svg { width: 100%; display: block; user-select: none; }
  .legend { display: flex; gap: 16px; font-size: 13px; opacity: .8; margin: 10px 4px 0; }
  .legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }
  .dcard { background: #2c2c2e; border-radius: 16px; padding: 14px 16px; margin-top: 12px; font-size: 15px; line-height: 1.5; }
  .dcard h3 { font-size: 13px; text-transform: uppercase; opacity: .6; margin-bottom: 6px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #3a3a3c; }
  .row:last-child { border-bottom: none; }
  .row span:last-child { opacity: .75; text-align: right; }
  .chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: -4px -16px 16px; padding: 0 16px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: 0 0 auto; border: none; border-radius: 18px; padding: 8px 14px; background: #2c2c2e;
    color: #fff; font-size: 15px; font-weight: 500; cursor: pointer; white-space: nowrap;
  }
  .chips button.on { background: #0a84ff; }
  .day.tap { border-radius: 8px; }
  .card.tap:has(.hourly):active { transform: none; }
  .hour { cursor: pointer; border-radius: 10px; padding: 2px 0; }
  .hour:active { background: rgba(255,255,255,.12); }
  .day.tap:active { background: rgba(255,255,255,.08); transform: none; }
</style>
</head>
<body>

<div id="pages"></div>

<div class="bottom">
  <button id="refreshBtn" title="Обновить">↻</button>
  <div class="dots" id="dots"></div>
  <button id="listBtn" title="Города">☰</button>
</div>

<div id="list">
  <div class="list-head">
    <button id="editBtn">Изменить</button>
    <button id="closeBtn">Готово</button>
  </div>
  <div class="list-head"><h1>Погода</h1></div>
  <div class="search">
    <input id="q" placeholder="🔍 Поиск города" autocomplete="off">
    <div class="results" id="results"></div>
  </div>
  <button class="geo-btn" id="geoBtn">📍 Добавить моё местоположение</button>
  <div id="cityList"></div>
  <div class="hint">Данные обновляются автоматически каждые 10 минут</div>
</div>

<div id="detail"></div>

<script>
const codes = {
  0:["Ясно","☀️","🌙"],1:["Преимущественно ясно","🌤️","🌙"],2:["Переменная облачность","⛅","☁️"],
  3:["Пасмурно","☁️","☁️"],45:["Туман","🌫️","🌫️"],48:["Изморозь","🌫️","🌫️"],
  51:["Морось","🌦️","🌧️"],53:["Морось","🌦️","🌧️"],55:["Сильная морось","🌧️","🌧️"],
  56:["Ледяная морось","🌧️","🌧️"],57:["Ледяная морось","🌧️","🌧️"],
  61:["Небольшой дождь","🌦️","🌧️"],63:["Дождь","🌧️","🌧️"],65:["Ливень","🌧️","🌧️"],
  66:["Ледяной дождь","🌧️","🌧️"],67:["Ледяной дождь","🌧️","🌧️"],
  71:["Небольшой снег","🌨️","🌨️"],73:["Снег","🌨️","🌨️"],75:["Сильный снег","❄️","❄️"],
  77:["Снежные зёрна","🌨️","🌨️"],80:["Ливни","🌦️","🌧️"],81:["Ливни","🌧️","🌧️"],
  82:["Сильные ливни","⛈️","⛈️"],85:["Снегопад","🌨️","🌨️"],86:["Сильный снегопад","❄️","❄️"],
  95:["Гроза","⛈️","⛈️"],96:["Гроза с градом","⛈️","⛈️"],99:["Гроза с градом","⛈️","⛈️"]
};
const info = (c, day = 1) => { const x = codes[c] || ["—","🌡️","🌡️"]; return { text: x[0], icon: day ? x[1] : x[2] }; };
const DAYS = ["Вс","Пн","Вт","Ср","Чт","Пт","Сб"];
const r = n => Math.round(n);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const $ = id => document.getElementById(id);
const DIRS = ["С","СВ","В","ЮВ","Ю","ЮЗ","З","СЗ"];
const dirText = deg => DIRS[Math.round(((deg % 360) + 360) % 360 / 45) % 8];
const mm = hpa => hpa * 0.750062;
const beaufort = v => v < 0.3 ? "Штиль" : v < 1.6 ? "Тихий" : v < 3.4 ? "Лёгкий" : v < 5.5 ? "Слабый" : v < 8 ? "Умеренный" : v < 10.8 ? "Свежий" : v < 13.9 ? "Сильный" : v < 17.2 ? "Крепкий" : v < 20.8 ? "Очень крепкий" : v < 24.5 ? "Шторм" : "Сильный шторм";

let cities = JSON.parse(localStorage.getItem("cities") || "null") || [{ name: "Москва", lat: 55.7558, lon: 37.6173 }];
let cache = JSON.parse(localStorage.getItem("weatherCache") || "{}");
let lastUpdate = +localStorage.getItem("lastUpdate") || 0;
let current = 0;
const key = c => c.lat.toFixed(3) + "," + c.lon.toFixed(3);
const saveCities = () => localStorage.setItem("cities", JSON.stringify(cities));

function themeOf(d) {
  if (!d) return "";
  const c = d.current, code = c.weather_code;
  if (!c.is_day) return "night";
  if ((code >= 71 && code <= 77) || code === 85 || code === 86) return "snow";
  if (code >= 51) return "rain";
  if (code >= 2) return "cloudy";
  return "";
}

async function fetchWeather(c) {
  const url = `https://api.open-meteo.com/v1/forecast?latitude=${c.lat}&longitude=${c.lon}` +
    `&current=temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,is_day,wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure,precipitation` +
    `&hourly=temperature_2m,apparent_temperature,relative_humidity_2m,precipitation,precipitation_probability,uv_index,weather_code,is_day,wind_speed_10m,wind_gusts_10m,wind_direction_10m,surface_pressure` +
    `&daily=weather_code,temperature_2m_max,temperature_2m_min,uv_index_max,sunrise,sunset,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max` +
    `&timezone=auto&forecast_days=10&wind_speed_unit=ms`;
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);
  try {
    const res = await fetch(url, { signal: ctl.signal });
    if (!res.ok) throw new Error("HTTP " + res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}

// ===== Запасной источник: прогноз, который GitHub раз в час кладёт в data/w/<город>.json =====
// Нужен, когда api.open-meteo.com недоступен у провайдера, а сам сайт открывается.
let directDown = false, mirror = null, mirrorAt = 0;
const failed = {};
async function getMirror() {
  if (mirror && Date.now() - mirrorAt < 60000) return mirror;
  const res = await fetch("data/index.json?t=" + Date.now());
  if (!res.ok) throw new Error("mirror HTTP " + res.status);
  mirror = await res.json(); mirrorAt = Date.now();
  return mirror;
}
const distKm = (a, b) => {
  const R = 6371, rad = x => x * Math.PI / 180, dLat = rad(b.lat - a.lat), dLon = rad(b.lon - a.lon);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
};
async function fetchMirror(c) {
  const m = await getMirror();
  let best = null, bd = Infinity;
  m.cities.forEach(x => { const dd = distKm(c, x); if (dd < bd) { bd = dd; best = x; } });
  if (!best || bd > 40) throw new Error("not-in-list");
  const res = await fetch(`data/w/${best.id}.json?t=` + Math.floor(Date.now() / 600000));
  if (!res.ok) throw new Error("mirror HTTP " + res.status);
  const d = await res.json();
  // «Сейчас» берём из почасового прогноза на текущий час города: файл обновляется раз в час
  const nowLocal = new Date(Date.now() + d.utc_offset_seconds * 1000).toISOString().slice(0, 13);
  const i = d.hourly.time.findIndex(t => t.slice(0, 13) === nowLocal);
  if (i >= 0) {
    ["temperature_2m", "apparent_temperature", "relative_humidity_2m", "weather_code", "is_day", "wind_speed_10m",
     "wind_gusts_10m", "wind_direction_10m", "surface_pressure", "precipitation"].forEach(f => { d.current[f] = d.hourly[f][i]; });
    d.current.time = d.hourly.time[i];
  }
  d._mirror = true;
  d._fetched = Date.parse(m.updated);
  return d;
}
async function getWeather(c) {
  if (!directDown) {
    try { return await fetchWeather(c); } catch (e) { directDown = true; }
  }
  return fetchMirror(c);
}

function pageHtml(d, c) {
  if (!d) return failed[key(c)] === "not-in-list"
    ? `<div class="loading">${esc(c.name)}<br><br><span style="font-size:15px">Сервис погоды сейчас недоступен напрямую, а этого города нет в списке, который обновляется через GitHub. Его можно добавить в список.</span></div>`
    : failed[key(c)] ? `<div class="loading">Нет соединения.<br><span style="font-size:15px">Нажмите ↻, чтобы повторить.</span></div>`
    : `<div class="loading">Загрузка…</div>`;
  const cur = d.current, dl = d.daily, h = d.hourly;
  const now = info(cur.weather_code, cur.is_day);

  let start = h.time.findIndex(t => t.slice(0, 13) === cur.time.slice(0, 13));
  if (start < 0) start = 0;
  let hours = "";
  for (let i = start; i < start + 24 && i < h.time.length; i++) {
    const label = i === start ? "Сейчас" : h.time[i].slice(11, 13);
    hours += `<div class="hour" data-hour="${i}"><div>${label}</div><div class="ic">${info(h.weather_code[i], h.is_day[i]).icon}</div><div>${r(h.temperature_2m[i])}°</div></div>`;
  }

  const gMin = Math.min(...dl.temperature_2m_min), gMax = Math.max(...dl.temperature_2m_max);
  const span = gMax - gMin || 1;
  let days = "";
  dl.time.forEach((t, i) => {
    const lo = dl.temperature_2m_min[i], hi = dl.temperature_2m_max[i];
    const left = (lo - gMin) / span * 100, width = Math.max((hi - lo) / span * 100, 4);
    days += `<div class="day tap" data-open-day="${i}">
      <div>${i === 0 ? "Сегодня" : DAYS[new Date(t + "T12:00").getDay()]}</div>
      <div>${info(dl.weather_code[i]).icon}</div>
      <div class="min">${r(lo)}°</div>
      <div class="bar"><span style="left:${left}%;width:${width}%"></span></div>
      <div>${r(hi)}°</div></div>`;
  });

  const uv = dl.uv_index_max[0] ?? 0;
  const uvText = uv < 3 ? "Низкий" : uv < 6 ? "Умеренный" : uv < 8 ? "Высокий" : "Очень высокий";
  const tm = s => s ? s.slice(11, 16) : "—";
  const p0 = h.surface_pressure ? h.surface_pressure[start] : cur.surface_pressure;
  const p3 = h.surface_pressure ? h.surface_pressure[Math.min(start + 3, h.time.length - 1)] : p0;
  const trend = p3 - p0 > 0.3 ? "↑ Растёт" : p0 - p3 > 0.3 ? "↓ Падает" : "→ Стабильно";
  const gust = cur.wind_gusts_10m ?? cur.wind_speed_10m;
  const windMini = h.wind_speed_10m ? miniChart(h.wind_speed_10m.slice(start, start + 24), "#64d2ff") : "";
  const presMini = h.surface_pressure ? miniChart(h.surface_pressure.slice(start, start + 24).map(mm), "#ffd60a") : "";
  const upd = d._fetched ? new Date(d._fetched).toLocaleTimeString("ru", { hour: "2-digit", minute: "2-digit" }) : "—";

  return `<div class="inner">
    <div class="hero">
      ${c.geo ? '<div class="sub">📍 Моё местоположение</div>' : ""}
      <div class="city">${esc(c.name)}</div>
      <div class="temp">${r(cur.temperature_2m)}°</div>
      <div class="desc">${now.text}</div>

// Мини-график для карточки
function miniChart(vals, color) {
  if (!vals.length) return "";
  const W = 300, H = 60, lo = Math.min(...vals), hi = Math.max(...vals), sp = (hi - lo) || 1;
  const pts = vals.map((v, i) => [i / (vals.length - 1) * W, 6 + (H - 12) * (1 - (v - lo) / sp)]);
  const line = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
  const id = "g" + Math.random().toString(36).slice(2, 8);
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:60px;display:block">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".45"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
    <path d="${line}L${W},${H}L0,${H}Z" fill="url(#${id})"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>
    <circle cx="0" cy="${pts[0][1]}" r="4" fill="#fff"/>
  </svg>`;
}

// ===== Подробный график (как на iPhone) =====
let detail = null, chart = null;

function bigChart(series, opt) {
  const W = 360, H = 230, L = 6, R = 40, T = opt.arrows ? 30 : 12, B = 24;
  const n = series[0].v.length;
  const all = series.flatMap(s => s.v);
  let lo, hi, step;
  if (opt.range) { [lo, hi] = opt.range; step = (hi - lo) / 4; }
  else {
    lo = opt.zero ? 0 : Math.min(...all); hi = Math.max(...all);
    if (!opt.zero) { lo -= 1; hi += 1; } else hi = hi * 1.15 + (opt.minTop || 1);
    step = opt.zero ? Math.max(opt.minStep || 1, Math.ceil((hi - lo) / 4)) : Math.max(1, Math.ceil((hi - lo) / 4));
    lo = opt.zero ? 0 : Math.floor(lo / step) * step; hi = lo + step * 4;
  }
  const x = i => L + (W - L - R) * i / (n - 1);
  const y = v => T + (H - T - B) * (1 - (v - lo) / (hi - lo));
  let s = "";
  for (let k = 0; k <= 4; k++) {
    const v = lo + step * k, yy = y(v);
    s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="#48484a" stroke-width="1"/>`;
    s += `<text x="${W - R + 6}" y="${yy + 4}" fill="#8e8e93" font-size="11">${r(v)}</text>`;
  }
  for (let i = 0; i < n; i += 6) {
    s += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${H - B}" stroke="#3a3a3c" stroke-dasharray="2 3"/>`;
    s += `<text x="${x(i)}" y="${H - 6}" fill="#8e8e93" font-size="11" text-anchor="${i ? "middle" : "start"}">${String(i).padStart(2, "0")}</text>`;
  }
  if (opt.nowIdx >= 0) {
    s += `<rect x="${L}" y="${T}" width="${x(opt.nowIdx) - L}" height="${H - T - B}" fill="#000" opacity=".25"/>`;
  }
  series.forEach((se, k) => {
    const d = se.v.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join("");
    if (k === 0) s += `<defs><linearGradient id="bg0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${se.color}" stop-opacity=".4"/><stop offset="1" stop-color="${se.color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${d}L${x(n - 1)},${H - B}L${x(0)},${H - B}Z" fill="url(#bg0)"/>`;
    s += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${k ? 2 : 3}" ${se.dash ? 'stroke-dasharray="5 4"' : ""} stroke-linejoin="round" stroke-linecap="round"/>`;
  });
  if (opt.arrows) {
    for (let i = 0; i < n; i += 3) {
      // стрелка показывает, КУДА дует ветер
      s += `<g transform="translate(${x(i)},14) rotate(${opt.arrows[i] + 180})"><path d="M0,-7 L4,4 L0,1.5 L-4,4 Z" fill="#fff" opacity=".85"/></g>`;
    }
  }
  s += `<line id="mkl" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="#fff" stroke-width="1.5" opacity="0"/>
        <circle id="mkc" r="6" fill="#fff" stroke="${series[0].color}" stroke-width="3" opacity="0"/>`;
  chart = { x, y, n, W, series };
  return `<svg id="bigsvg" viewBox="0 0 ${W} ${H}">${s}</svg>`;
}

function openDetail(type, day = 0, hour = null) {
  detail = { type, day, hour };
  renderDetail();

function closeDetail(fromPop) {
  if (!detail) return;
  detail = null;
  $("detail").classList.remove("open");
  if (!fromPop && history.state && history.state.detail) history.back();
}

    summary: s => { const sp = s[0].v, gu = s[1].v, mg = Math.max(...gu); return `Средняя скорость ${(sp.reduce((a, b) => a + b, 0) / sp.length).toFixed(1)} м/с, максимум ${r(Math.max(...sp))} м/с, порывы до ${r(mg)} м/с. ${mg >= 15 ? "⚠️ Ожидаются сильные порывы." : ""}`; }

    row: (s, i) => `${s[0].v[i].toFixed(1)} мм рт. ст.`,
    summary: s => { const pr = s[0].v, diff = pr[pr.length - 1] - pr[0]; return `От ${r(Math.min(...pr))} до ${r(Math.max(...pr))} мм рт. ст. ${diff > 1 ? "Давление растёт ↑" : diff < -1 ? "Давление падает ↓" : "Давление стабильно →"} (${diff > 0 ? "+" : ""}${diff.toFixed(1)}). Норма ≈ 760 мм на уровне моря; на высоте значения ниже.`; }
  },

    opt: () => ({ range: [0, 100] }),

    row: (s, i) => `${r(s[0].v[i])}%`,
    summary: s => { const v = s[0].v; return `От ${r(Math.min(...v))}% до ${r(Math.max(...v))}%, в среднем ${r(v.reduce((a, b) => a + b, 0) / v.length)}%.`; }
  },

    summary: (s, h, idx) => { const sum = s[0].v.reduce((a, b) => a + b, 0), pmax = Math.max(...idx.map(i => h.precipitation_probability[i] ?? 0)); return sum < 0.1 ? `Без осадков. Вероятность не выше ${pmax}%.` : `Всего за день ${sum.toFixed(1)} мм, вероятность до ${pmax}%.`; }

const METRIC_ORDER = ["temp", "wind", "pressure", "humidity", "precip", "uv"];

function renderDetail() {
  const c = cities[current], d = c && cache[key(c)];
  if (!detail || !d || !d.hourly.relative_humidity_2m) {
    if (detail) $("detail").innerHTML = `<div class="dhead"><h2>Загрузка…</h2><button id="dclose">✕</button></div>`;
    return;
  }
  const h = d.hourly, dl = d.daily, day = detail.day, M = METRICS[detail.type];
  const date = dl.time[day];
  const idx = []; h.time.forEach((t, i) => { if (t.slice(0, 10) === date) idx.push(i); });
  const nowIdx = day === 0 ? idx.findIndex(i => h.time[i].slice(0, 13) === d.current.time.slice(0, 13)) : -1;

  const tabs = dl.time.map((t, i) => `<button class="${i === day ? "on" : ""}" data-day="${i}">
    <small>${i === 0 ? "Сег" : DAYS[new Date(t + "T12:00").getDay()]}</small><b>${+t.slice(8, 10)}</b></button>`).join("");
  const chips = METRIC_ORDER.map(k => `<button class="${k === detail.type ? "on" : ""}" data-metric="${k}">${METRICS[k].chip}</button>`).join("");

  const series = M.series(h, idx);
  const opt = { ...M.opt(h, idx), nowIdx };
  let rows = "";
  for (let k = 0; k < idx.length; k += 3) rows += `<div class="row"><span>${h.time[idx[k]].slice(11, 16)}</span><span>${M.row(series, k, h, idx[k])}</span></div>`;

  // Итоги дня по всем показателям
  const tm = s => s ? s.slice(11, 16) : "—";
  const hum = idx.map(i => h.relative_humidity_2m[i]), pr = idx.map(i => mm(h.surface_pressure[i]));
  const dayInfo = info(dl.weather_code[day]);
  const overview = [
    ["Погода", `${dayInfo.icon} ${dayInfo.text}`],
    ["Температура", `${r(dl.temperature_2m_min[day])}° … ${r(dl.temperature_2m_max[day])}°`],
    ["Ветер", `до ${r(dl.wind_speed_10m_max[day])} м/с, порывы до ${r(dl.wind_gusts_10m_max[day])}`],
    ["Давление", `${r(Math.min(...pr))}–${r(Math.max(...pr))} мм рт. ст.`],
    ["Влажность", `${r(Math.min(...hum))}–${r(Math.max(...hum))}%`],
    ["Осадки", `${(dl.precipitation_sum[day] ?? 0).toFixed(1)} мм · вероятность ${dl.precipitation_probability_max[day] ?? 0}%`],
    ["УФ-индекс", `${r(dl.uv_index_max[day] ?? 0)}`],
    ["Восход / закат", `${tm(dl.sunrise[day])} / ${tm(dl.sunset[day])}`]
  ].map(([a, b]) => `<div class="row"><span>${a}</span><span>${b}</span></div>`).join("");

  const svg = bigChart(series, opt);
  const legend = series.length > 1 ? series.map(s => `<span><i style="background:${s.color}"></i>${s.name}</span>`).join("") : "";
  const dateText = new Date(date + "T12:00").toLocaleDateString("ru", { day: "numeric", month: "long" });
  $("detail").innerHTML = `
    <div class="dhead"><h2>${esc(c.name)} · ${dateText}</h2><button id="dclose">✕</button></div>
    <div class="tabs">${tabs}</div>
    <div class="chips">${chips}</div>
    <div class="dval" id="dval"></div>
    <div class="dsub" id="dsub"></div>
    <div class="chart-box" id="cbox">${svg}${legend ? `<div class="legend">${legend}</div>` : ""}</div>
    <div class="dcard"><h3>${M.title} · сводка</h3>${M.summary(series, h, idx)}</div>
    <div class="dcard"><h3>Каждые 3 часа</h3>${rows}</div>
    <div class="dcard"><h3>Весь день</h3>${overview}</div>
    <div class="hint">Проведите пальцем по графику, чтобы увидеть значение в любой час</div>`;
  detail.idx = idx;
  const focus = detail.hour != null ? idx.indexOf(detail.hour) : -1;
  detail.hour = null;
  showPoint(focus >= 0 ? focus : nowIdx >= 0 ? nowIdx : 12);
  $("detail").querySelector(".tabs .on")?.scrollIntoView({ inline: "center", block: "nearest" });
  $("detail").querySelector(".chips .on")?.scrollIntoView({ inline: "center", block: "nearest" });
}

function showPoint(i) {
  if (!chart || !detail) return;
  i = Math.max(0, Math.min(chart.n - 1, i));
  const M = METRICS[detail.type], s = chart.series, h = cache[key(cities[current])].hourly, hi = detail.idx[i];
  const xx = chart.x(i), yy = chart.y(s[0].v[i]);
  const l = $("mkl"), c = $("mkc");
  l.setAttribute("x1", xx); l.setAttribute("x2", xx); l.setAttribute("opacity", ".7");
  c.setAttribute("cx", xx); c.setAttribute("cy", yy); c.setAttribute("opacity", "1");
  $("dval").textContent = M.val(s, i, h, hi);
  $("dsub").textContent = `${h.time[hi].slice(11, 16)} · ${M.sub(s, i, h, hi)}`;
}

function scrub(e) {
  const svg = $("bigsvg"); if (!svg) return;
  const rect = svg.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width * chart.W;
  let best = 0, bd = 1e9;
  for (let i = 0; i < chart.n; i++) { const dd = Math.abs(chart.x(i) - px); if (dd < bd) { bd = dd; best = i; } }
  showPoint(best);
}

$("detail").addEventListener("click", e => {
  if (e.target.closest("#dclose")) return closeDetail();
  const tb = e.target.closest("[data-day]");
  if (tb) { detail.day = +tb.dataset.day; renderDetail(); return; }
  const mt = e.target.closest("[data-metric]");
  if (mt) { detail.type = mt.dataset.metric; renderDetail(); }
});
$("detail").addEventListener("pointerdown", e => { if (e.target.closest("#cbox")) scrub(e); });
$("detail").addEventListener("pointermove", e => { if (e.target.closest("#cbox") && (e.buttons || e.pointerType === "touch")) scrub(e); });
$("detail").addEventListener("touchmove", e => { if (e.target.closest("#cbox")) scrub(e.touches[0]); }, { passive: true });
$("pages").addEventListener("click", e => {
  const hr = e.target.closest("[data-hour]");
  if (hr) {
    const d = cache[key(cities[current])], hi = +hr.dataset.hour;
    const day = d ? Math.max(0, d.daily.time.indexOf(d.hourly.time[hi].slice(0, 10))) : 0;

});

function updateTheme() {
  const c = cities[current];
  document.body.className = c ? themeOf(cache[key(c)]) : "";
  const colors = { "": "#2f6fb5", night: "#0b1026", cloudy: "#5b6b7d", rain: "#3a4a5c", snow: "#7d8fa6" };
  const bottoms = { "": "#6aa3d8", night: "#2b3a67", cloudy: "#9aa7b5", rain: "#66788a", snow: "#b9c6d4" };
  document.querySelector('meta[name="theme-color"]').content = colors[document.body.className] || "#2f6fb5";
  document.documentElement.style.background = bottoms[document.body.className] || "#6aa3d8";
  document.querySelectorAll("#dots i").forEach((el, i) => el.classList.toggle("on", i === current));
}

function goTo(i, smooth = true) {
  current = Math.max(0, i);
  const p = $("pages");
  p.scrollTo({ left: current * p.clientWidth, behavior: smooth ? "smooth" : "auto" });
  updateTheme();
}

$("pages").addEventListener("scroll", () => {
  const p = $("pages");
  const i = Math.round(p.scrollLeft / p.clientWidth);
  if (i !== current) { current = i; updateTheme(); }
});

async function loadAll() {
  $("refreshBtn").innerHTML = '<span class="spin">↻</span>';
  await Promise.all(cities.map(async c => {
    try {
      const d = await getWeather(c);
      if (!d._fetched) d._fetched = Date.now();
      cache[key(c)] = d;
      delete failed[key(c)];
    } catch (e) { failed[key(c)] = e.message; /* остаются старые данные из кэша */ }
  }));
  const keep = {};
  cities.forEach(c => { if (cache[key(c)]) keep[key(c)] = cache[key(c)]; });
  cache = keep;
  try { localStorage.setItem("weatherCache", JSON.stringify(cache)); } catch {}
  lastUpdate = Date.now();
  localStorage.setItem("lastUpdate", lastUpdate);
  const sc = $("pages").scrollLeft;
  renderPages();
  $("pages").scrollLeft = sc;
  renderList();
  updateTheme();
  if (detail) { const keepDay = detail.day; renderDetail(); if (detail) detail.day = keepDay; }
  $("refreshBtn").textContent = "↻";
}

async function addCity(c) {
  const idx = cities.findIndex(x => key(x) === key(c));
  if (idx >= 0) { closeList(); goTo(idx); return; }
  if (c.geo) { cities = cities.filter(x => !x.geo); cities.unshift(c); }
  else cities.push(c);
  saveCities();
  renderPages(); renderList();
  closeList();
  const target = c.geo ? 0 : cities.length - 1;
  setTimeout(() => goTo(target), 50);
  await loadAll();
}

// Поиск городов
let timer;
$("q").addEventListener("input", e => {
  clearTimeout(timer);
  const v = e.target.value.trim();
  if (v.length < 2) { $("results").innerHTML = ""; return; }
  timer = setTimeout(async () => {
    try {
      let res, fromList = false;
      try {
        const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 6000);
        const j = await (await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(v)}&count=7&language=ru`, { signal: ctl.signal })).json();
        clearTimeout(t);
        res = j.results || [];
      } catch {
        // поиск в интернете недоступен: ищем среди городов, которые обновляются через GitHub
        const m = await getMirror(); fromList = true;
        const nv = v.toLowerCase().replace(/ё/g, "е");
        res = m.cities.filter(x => x.name.toLowerCase().replace(/ё/g, "е").includes(nv)).slice(0, 10).map(x => ({ name: x.name, latitude: x.lat, longitude: x.lon, admin1: x.region }));
      }
      $("results").innerHTML = res.length
        ? res.map((g, i) => `<div data-g="${i}">${esc(g.name)} <small>${esc([g.admin1, g.country].filter(Boolean).join(", "))}</small></div>`).join("")
        : `<div style="opacity:.6">${fromList ? "Поиск в интернете недоступен, а в списке обновления такого города нет" : "Ничего не найдено"}</div>`;
      $("results").querySelectorAll("[data-g]").forEach(el => el.onclick = () => {
        const g = res[+el.dataset.g];
        $("q").value = ""; $("results").innerHTML = "";
        addCity({ name: g.name, lat: g.latitude, lon: g.longitude });
      });
    } catch { $("results").innerHTML = `<div style="opacity:.6">Нет соединения</div>`; }
  }, 300);
});

// Геолокация
$("geoBtn").onclick = () => {
  if (!navigator.geolocation) return alert("Геолокация недоступна");
  $("geoBtn").textContent = "📍 Определяю…";
  navigator.geolocation.getCurrentPosition(async p => {
    const lat = p.coords.latitude, lon = p.coords.longitude;
    let name = "Моё место";
    try {
      const j = await (await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ru`)).json();
      const a = j.address || {};
      name = a.city || a.town || a.village || a.state || name;
    } catch {}
    $("geoBtn").textContent = "📍 Добавить моё местоположение";
    addCity({ name, lat, lon, geo: true });
  }, () => {
    $("geoBtn").textContent = "📍 Добавить моё местоположение";
    alert("Не удалось определить местоположение. Разрешите доступ к геолокации в настройках браузера.");
  }, { timeout: 15000 });
};

// Список городов
const openList = () => { renderList(); $("list").classList.add("open"); history.pushState({ list: 1 }, ""); };
function closeList(fromPop) {
  if (!$("list").classList.contains("open")) return;
  $("list").classList.remove("open", "edit"); $("editBtn").textContent = "Изменить";
  if (fromPop !== true && history.state && history.state.list) history.back();
}
$("listBtn").onclick = openList;
$("closeBtn").onclick = () => closeList();
$("editBtn").onclick = () => {
  const on = $("list").classList.toggle("edit");
  $("editBtn").textContent = on ? "Готово" : "Изменить";
};
$("cityList").addEventListener("click", e => {
  const del = e.target.dataset.del;
  if (del !== undefined) {
    e.stopPropagation();
    if (cities.length === 1) return alert("Должен остаться хотя бы один город");
    cities.splice(+del, 1);
    saveCities();
    if (current >= cities.length) current = cities.length - 1;
    renderPages(); renderList();
    return;
  }
  const item = e.target.closest(".citem");
  if (item && !$("list").classList.contains("edit")) { closeList(); goTo(+item.dataset.i, false); }
});

$("refreshBtn").onclick = () => { directDown = false; loadAll(); };

// Автообновление: каждые 10 минут и при возврате в приложение
setInterval(loadAll, 10 * 60 * 1000);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - lastUpdate > 5 * 60 * 1000) loadAll();
});
window.addEventListener("online", loadAll);
window.addEventListener("resize", () => goTo(current, false));

renderPages();
updateTheme();
loadAll();

// Установка как приложение (Android / Chrome)
if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
